name: Release and Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Debian Package and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - name: Get Version & Build Binary
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          echo "ARCH=$(dpkg --print-architecture)" >> "$GITHUB_ENV"
          RUSTFLAGS="-D warnings" cargo build --release

      - name: Build .deb Package
        run: |
          PKG_DIR="anon_${VERSION}_${ARCH}"
          mkdir -p "${PKG_DIR}/DEBIAN"
          cat <<EOF > "${PKG_DIR}/DEBIAN/control"
          Package: anon
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: egnake <egcaem000@gmail.com>
          Depends: tar, iptables, tor, obfs4proxy, macchanger, proxychains4, secure-delete, rfkill, firejail, iproute2, curl, i2pd, dnscrypt-proxy, snowflake-client, mat2, libimage-exiftool-perl, psmisc, unzip, apparmor-utils, dmidecode, iputils-ping, ca-certificates
          Recommends: libnotify-bin
          Description: Advanced OPSEC & Anonymity Framework
           A comprehensive, modular anonymity and anti-forensics toolkit for Linux environments.
          EOF

          cat <<'EOF' > "${PKG_DIR}/DEBIAN/prerm"
          #!/bin/bash
          set -e
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
              rm -f /etc/NetworkManager/conf.d/anon-dns-lock.conf
              rm -f /etc/apparmor.d/usr.bin.tor.anon
              rm -f /usr/local/bin/*.anon-sandbox
          fi
          EOF
          chmod 755 "${PKG_DIR}/DEBIAN/prerm"

          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/anon/backups"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/kali-menu/applications"

          install -m 755 target/release/anon "${PKG_DIR}/usr/bin/anon"
          cp -a assets "${PKG_DIR}/usr/share/anon/"
          rm -f "${PKG_DIR}/usr/share/anon/assets/sources/bridges.txt"
          chmod 644 "${PKG_DIR}/usr/share/anon/assets/sources/anon.js" \
              "${PKG_DIR}/usr/share/anon/assets/sources/bridges.default.txt"
          cp -f assets/anon.desktop "${PKG_DIR}/usr/share/applications/"
          cp -f assets/anon.desktop "${PKG_DIR}/usr/share/kali-menu/applications/"

          fakeroot dpkg-deb --build "${PKG_DIR}"

      - name: Create Tarball Source & Checksums
        run: |
          tar --exclude='assets/sources/bridges.txt' --exclude='backups/*.tar.gz' -czvf "anon_${VERSION}_source.tar.gz" Cargo.toml src anon.bat assets setup.sh setup.bat Makefile README.md README-TR.md LICENSE
          sha256sum "anon_${VERSION}_${ARCH}.deb" "anon_${VERSION}_source.tar.gz" > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            anon_${{ env.VERSION }}_${{ env.ARCH }}.deb
            anon_${{ env.VERSION }}_source.tar.gz
            SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

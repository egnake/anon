name: Release and Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Debian Package and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - name: Get Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build .deb Package
        run: |
          mkdir -p anon_${VERSION}_all/DEBIAN
          cat <<EOF > anon_${VERSION}_all/DEBIAN/control
          Package: anon
          Version: ${VERSION}
          Architecture: all
          Maintainer: egnake <egcaem000@gmail.com>
          Depends: bash, tar, iptables, tor, obfs4proxy, macchanger, proxychains4, secure-delete, rfkill, firejail, iproute2, curl, i2pd, dnscrypt-proxy, snowflake-client, mat2, libimage-exiftool-perl, psmisc, unzip, ca-certificates
          Description: Advanced OPSEC & Anonymity Framework
           A comprehensive, modular anonymity and anti-forensics toolkit for Linux environments.
          EOF

          cat <<'EOF' > anon_${VERSION}_all/DEBIAN/conffiles
          /usr/share/anon/assets/sources/config
          EOF

          cat <<'EOF' > anon_${VERSION}_all/DEBIAN/prerm
          #!/bin/bash
          set -e
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
              rm -f /etc/NetworkManager/conf.d/anon-dns-lock.conf
              rm -f /etc/apparmor.d/usr.bin.tor.anon
              rm -f /usr/local/bin/*.anon-sandbox
          fi
          EOF
          chmod 755 anon_${VERSION}_all/DEBIAN/prerm

          mkdir -p anon_${VERSION}_all/usr/bin
          mkdir -p anon_${VERSION}_all/usr/share/anon/backups
          mkdir -p anon_${VERSION}_all/usr/share/applications
          mkdir -p anon_${VERSION}_all/usr/share/kali-menu/applications

          install -m 755 anon anon_${VERSION}_all/usr/bin/anon
          cp -a assets anon_${VERSION}_all/usr/share/anon/
          rm -f anon_${VERSION}_all/usr/share/anon/assets/sources/bridges.txt
          chmod 755 anon_${VERSION}_all/usr/share/anon/assets/scripts/*
          chmod 644 anon_${VERSION}_all/usr/share/anon/assets/sources/config \
              anon_${VERSION}_all/usr/share/anon/assets/sources/helpers \
              anon_${VERSION}_all/usr/share/anon/assets/sources/anon.js \
              anon_${VERSION}_all/usr/share/anon/assets/sources/bridges.default.txt
          cp -f assets/anon.desktop anon_${VERSION}_all/usr/share/applications/
          cp -f assets/anon.desktop anon_${VERSION}_all/usr/share/kali-menu/applications/

          fakeroot dpkg-deb --build anon_${VERSION}_all

      - name: Create Tarball Source & Checksums
        run: |
          tar --exclude='assets/sources/bridges.txt' --exclude='backups/*.tar.gz' -czvf anon_${VERSION}_source.tar.gz anon anon.bat assets setup.sh setup.bat Makefile README.md README-TR.md LICENSE
          sha256sum anon_${VERSION}_all.deb anon_${VERSION}_source.tar.gz > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            anon_${VERSION}_all.deb
            anon_${VERSION}_source.tar.gz
            SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bash \
            shellcheck \
            iproute2 \
            iptables

      - name: Syntax Check (bash -n)
        run: |
          bash -n anon
          bash -n setup.sh
          bash -n test_suite.sh
          for script in assets/scripts/*; do
            bash -n "$script"
          done

      - name: ShellCheck Lint
        run: |
          shellcheck -S warning -e SC1090,SC1091,SC2034,SC2086 anon assets/scripts/* setup.sh test_suite.sh

      - name: Run Test Suite
        run: |
          chmod +x test_suite.sh
          ./test_suite.sh
